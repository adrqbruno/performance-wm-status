<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Status Executivo — Webmotors</title>
<style>
  :root{
    --brand:#e00000;--brand-dark:#b00000;
    --bg:#f5f5fa;--surface:#ffffff;
    --ink:#1a1a1a;--ink-soft:#4d4d55;--ink-faint:#8a8a94;
    --line:#e8e8ef;--line-soft:#f0f0f5;
    --done:#0a8043;--done-bg:#e6f4ec;
    --doing:#c77700;--doing-bg:#fdf1e0;
    --todo:#6a6a76;--todo-bg:#eeeef3;
    --shadow:0 2px 12px rgba(20,20,40,.06);
    --shadow-hover:0 6px 24px rgba(20,20,40,.12);
    --radius:16px;--radius-sm:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  a{color:inherit}

  /* Top bar */
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .topbar .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
  .logo .mark{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:-.05em}
  .logo small{font-weight:600;font-size:12px;color:var(--ink-faint);letter-spacing:0;margin-left:2px}

  /* Date selector */
  .picker{margin-left:auto;display:flex;align-items:center;gap:10px}
  .picker label{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .select-shell{position:relative;display:inline-block}
  select#dateSel{
    appearance:none;-webkit-appearance:none;
    font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
    padding:10px 40px 10px 18px;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;
    min-width:200px;
  }
  select#dateSel:hover{border-color:#d4d4de}
  select#dateSel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(224,0,0,.12)}
  .select-shell::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:translateY(-70%) rotate(45deg);pointer-events:none}

  /* Head */
  .head{padding:32px 0 8px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .head .metas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-soft);font-weight:500}
  .chip b{color:var(--ink);font-weight:700}
  .chip .ic{color:var(--ink-faint)}
  .chip.live b{color:var(--brand)}
  .chip.hist{background:var(--doing-bg);border-color:transparent;color:var(--doing)}
  .chip.hist b{color:var(--doing)}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:16px}
  .card h2{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .card h2 .count{font-size:11px;color:var(--ink-faint);font-weight:700;background:var(--bg);border-radius:999px;padding:2px 9px;letter-spacing:.02em}
  .lede{font-size:16.5px;line-height:1.62;color:var(--ink-soft)}
  .lede + .lede{margin-top:13px}
  .lede b{color:var(--ink);font-weight:700}

  /* Counters */
  .counters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  .counter{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--todo)}
  .counter.done{border-left-color:var(--done)}
  .counter.doing{border-left-color:var(--doing)}
  .counter .num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .counter.done .num{color:var(--done)}
  .counter.doing .num{color:var(--doing)}
  .counter.todo .num{color:var(--todo)}
  .badge{align-self:flex-start;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;letter-spacing:.01em}
  .badge.done{background:var(--done-bg);color:var(--done)}
  .badge.doing{background:var(--doing-bg);color:var(--doing)}
  .badge.todo{background:var(--todo-bg);color:var(--todo)}

  /* Audit groups */
  .group{margin-bottom:20px}
  .group:last-child{margin-bottom:0}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  ul.audits{list-style:none;display:grid;gap:8px}
  ul.audits li{background:var(--bg);border-radius:var(--radius-sm);padding:12px 15px;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:11px}
  ul.audits li::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
  .group.done ul.audits li::before{background:var(--done)}
  .group.doing ul.audits li::before{background:var(--doing)}
  .group.todo ul.audits li::before{background:var(--todo)}

  /* Findings */
  ul.findings{list-style:none;display:grid;gap:2px}
  ul.findings li{padding:15px 0;border-bottom:1px solid var(--line-soft);font-size:15.5px;line-height:1.55;color:var(--ink-soft)}
  ul.findings li:last-child{border-bottom:none}
  ul.findings li b{color:var(--ink);font-weight:700}

  /* Dailies */
  .daily{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .daily:last-child{border-bottom:none}
  .daily .d{font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .daily .d span{display:block;font-weight:500;font-size:12px;color:var(--ink-faint);margin-top:3px}
  .daily .txt{font-size:15px;color:var(--ink-soft);line-height:1.55}

  /* Next */
  ol.next{list-style:none;counter-reset:s;display:grid;gap:10px}
  ol.next li{counter-increment:s;background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px 14px 52px;position:relative;font-size:15px;color:var(--ink-soft);line-height:1.5}
  ol.next li::before{content:counter(s);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

  footer{padding:24px 0 48px;font-size:12.5px;color:var(--ink-faint);line-height:1.6;text-align:center}
  footer b{color:var(--ink-soft);font-weight:700}

  /* fade on switch */
  #content{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#content{animation:none}}

  @media (max-width:640px){
    h1{font-size:24px}
    .counters{grid-template-columns:1fr}
    .counter{flex-direction:row;align-items:center;justify-content:space-between}
    .card{padding:20px}
    .daily{grid-template-columns:1fr;gap:6px}
    .picker{width:100%;margin-left:0}
    select#dateSel{flex:1;min-width:0;width:100%}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <a class="logo" href="./"><span class="mark">HH</span>webmotors<small>· Status executivo</small></a>
      <div class="picker">
        <label for="dateSel">Data</label>
        <div class="select-shell">
          <select id="dateSel" aria-label="Selecionar data do status"></select>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="content"><!-- render dinâmico --></div>
    <footer>
      <p><b>Webmotors — Status Executivo diário.</b> Operação white label ZMES · Uso interno do time.</p>
      <p>Fonte: Notion (somente leitura). Cada data é uma fotografia daquele dia.</p>
    </footer>
  </div>

<script src="data.js"></script>
<script>
  (function(){
    var sel = document.getElementById('dateSel');
    var content = document.getElementById('content');

    if(!window.STATUS || !STATUS.length){
      content.innerHTML = '<div class="card"><h2>Sem dados</h2><p class="lede">Nenhum status publicado ainda. Adicione um bloco em <b>data.js</b>.</p></div>';
      return;
    }

    // ordena do mais recente para o mais antigo (por data ISO)
    STATUS.sort(function(a,b){ return a.data < b.data ? 1 : (a.data > b.data ? -1 : 0); });

    // popula o dropdown
    STATUS.forEach(function(s, i){
      var opt = document.createElement('option');
      opt.value = s.data;
      opt.textContent = s.dataBR + (i === 0 ? '  ·  mais recente' : '');
      sel.appendChild(opt);
    });

    function esc(t){ return t; } // conteúdo é próprio, controlado em data.js

    function li(items){ return items.map(function(x){ return '<li>'+x+'</li>'; }).join(''); }

    function render(s){
      var totalMap = s.auditorias;
      var nDone = totalMap.concluido.length, nDoing = totalMap.andamento.length, nTodo = totalMap.afazer.length;
      var total = nDone + nDoing + nTodo;
      var isLatest = (STATUS[0].data === s.data);

      var html = '';
      // head
      html += '<div class="head">';
      html += '<h1>Status Executivo — Auditorias &amp; Dailies</h1>';
      html += '<div class="metas">';
      html += '<span class="chip"><span class="ic">Referente a</span> <b>'+s.dataBR+'</b></span>';
      html += '<span class="chip"><span class="ic">Período</span> <b>'+s.periodo+'</b></span>';
      if(isLatest){
        html += '<span class="chip live"><b>● Status mais recente</b></span>';
      } else {
        html += '<span class="chip hist"><b>Status histórico</b></span>';
      }
      html += '</div></div>';

      // sumário
      html += '<div class="card"><h2>Sumário executivo</h2>';
      html += s.sumario.map(function(p){ return '<p class="lede">'+p+'</p>'; }).join('');
      html += '</div>';

      // counters
      html += '<div class="counters">';
      html += '<div class="counter done"><div class="num">'+nDone+'</div><span class="badge done">Concluído</span></div>';
      html += '<div class="counter doing"><div class="num">'+nDoing+'</div><span class="badge doing">Em Andamento</span></div>';
      html += '<div class="counter todo"><div class="num">'+nTodo+'</div><span class="badge todo">A Fazer</span></div>';
      html += '</div>';

      // auditorias
      html += '<div class="card"><h2>Status das auditorias <span class="count">'+total+' mapeadas</span></h2>';
      html += '<div class="group done"><div class="group-head"><span class="badge done">Concluído — '+nDone+'</span></div><ul class="audits">'+li(totalMap.concluido)+'</ul></div>';
      html += '<div class="group doing"><div class="group-head"><span class="badge doing">Em Andamento — '+nDoing+'</span></div><ul class="audits">'+li(totalMap.andamento)+'</ul></div>';
      html += '<div class="group todo"><div class="group-head"><span class="badge todo">A Fazer — '+nTodo+'</span></div><ul class="audits">'+li(totalMap.afazer)+'</ul></div>';
      html += '</div>';

      // achados
      html += '<div class="card"><h2>Principais achados estruturais</h2><ul class="findings">';
      html += s.achados.map(function(a){ return '<li><b>'+a[0]+'</b> '+a[1]+'</li>'; }).join('');
      html += '</ul></div>';

      // dailies
      html += '<div class="card"><h2>Overview das dailies</h2>';
      html += s.dailies.map(function(d){ return '<div class="daily"><div class="d">'+d[0]+'<span>'+d[1]+'</span></div><div class="txt">'+d[2]+'</div></div>'; }).join('');
      html += '</div>';

      // próximos
      html += '<div class="card"><h2>Próximos passos</h2><ol class="next">';
      html += s.proximos.map(function(p){ return '<li>'+p+'</li>'; }).join('');
      html += '</ol></div>';

      content.innerHTML = html;
    }

    function show(dateVal){
      var s = STATUS.filter(function(x){ return x.data === dateVal; })[0] || STATUS[0];
      sel.value = s.data;
      render(s);
      // reinicia animação
      content.style.animation = 'none'; void content.offsetWidth; content.style.animation = '';
      // atualiza a URL (permite compartilhar link de um dia específico)
      if(history.replaceState){ history.replaceState(null, '', '#'+s.data); }
    }

    sel.addEventListener('change', function(){ show(this.value); });

    // abre no dia do hash (se houver) ou no mais recente
    var hash = (location.hash || '').replace('#','');
    var start = STATUS.some(function(x){ return x.data === hash; }) ? hash : STATUS[0].data;
    show(start);
  })();
</script>
</body>
</html>
